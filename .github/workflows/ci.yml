name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Published model versions are unchanged
        run: python scripts/lock_models.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Manifests are valid JSON
        run: for f in models/*/v*/manifest.json; do python -m json.tool "$f" > /dev/null; done
